[project]
name = "printpal"
version = "0.1.0"
description = "AI-powered 3D printing assistant — search, slice, and print from your terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
    "smolagents[litellm,mcp,toolkit]>=1.26.0",
    "prompt-toolkit>=3.0",
]

[project.scripts]
printpal = "printpal.app:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printpal"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require real tools (e.g. OrcaSlicer) or sibling checkouts; deselect with -m 'not integration'",
]
